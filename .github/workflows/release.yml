name: Release

# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # SLSA build-provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false   # stdlib-only: no go.sum, nothing to cache

      - run: go vet ./... && test -z "$(gofmt -l .)" && go test ./...

      # One job builds every target so a single SHA256SUMS covers them all and one
      # `gh release create` publishes the set (a job matrix would need artifact
      # upload/download plumbing just to recombine the checksums).
      - name: Build (static, all targets)
        env:
          CGO_ENABLED: '0'
        run: |
          set -eu
          for target in linux/amd64 windows/amd64; do
            goos=${target%/*}; goarch=${target#*/}
            out="anjin-intel-${goos}-${goarch}"
            if [ "$goos" = windows ]; then out="${out}.exe"; fi
            echo "building $out"
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$out" ./cmd/anjin-intel
          done
          sha256sum anjin-intel-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            anjin-intel-linux-amd64
            anjin-intel-windows-amd64.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            anjin-intel-linux-amd64 anjin-intel-windows-amd64.exe SHA256SUMS \
            --title "${GITHUB_REF_NAME}" --generate-notes
